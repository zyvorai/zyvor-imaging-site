# Publishes the repository root (the built Zyvor Imaging site) to GitHub Pages.
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: deployment
        uses: actions/deploy-pages@v4
