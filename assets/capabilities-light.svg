<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
<title id="t">Capabilities</title><desc id="d">Six capability cards for Zyvor Imaging.</desc>
<defs></defs>
<rect x="0" y="0" width="1280" height="420" rx="0" fill="#ffffff"/>
<text x="64" y="56" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#1d1d1f" letter-spacing="-0.8">What it does</text><text x="64" y="90" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">A single-site imaging archive and research workspace.</text><rect x="64" y="130" width="370" height="110" rx="20" fill="#f5f5f7" stroke="#d2d2d7"/><text x="88" y="172" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1d1d1f">Archive</text><text x="88" y="202" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e73">Original DICOM bytes, UID checks, SHA-256 verification</text><rect x="454" y="130" width="370" height="110" rx="20" fill="#f5f5f7" stroke="#d2d2d7"/><text x="478" y="172" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1d1d1f">Viewer</text><text x="478" y="202" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e73">Window/level, measurements, series navigation</text><rect x="844" y="130" width="370" height="110" rx="20" fill="#f5f5f7" stroke="#d2d2d7"/><text x="868" y="172" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1d1d1f">Reporting</text><text x="868" y="202" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e73">Drafts, finals, amendments with version history</text><rect x="64" y="260" width="370" height="110" rx="20" fill="#f5f5f7" stroke="#d2d2d7"/><text x="88" y="302" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1d1d1f">Gateway</text><text x="88" y="332" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e73">DIMSE C-STORE / C-FIND / C-MOVE with TLS</text><rect x="454" y="260" width="370" height="110" rx="20" fill="#f5f5f7" stroke="#d2d2d7"/><text x="478" y="302" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1d1d1f">DICOMweb</text><text x="478" y="332" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e73">STOW, QIDO, WADO and rendered frames</text><rect x="844" y="260" width="370" height="110" rx="20" fill="#f5f5f7" stroke="#d2d2d7"/><text x="868" y="302" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1d1d1f">Identity</text><text x="868" y="332" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e73">Local roles, TOTP, OIDC + MFA claims</text>
</svg>
